
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Startuppgifter i Matematik</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #2c3e50;
        }
        .controls {
            background: #f4f6f7;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #dcdde1;
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        button {
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            margin-right: 10px;
        }
        button:hover { background-color: #219150; }
        .print-btn { background-color: #2980b9; }
        .print-btn:hover { background-color: #1c5980; }

        /* Utskriftdesign för uppgiftsbladet */
        .worksheet-title {
            text-align: center;
            margin-bottom: 25px;
        }
        .header-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .task-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .task-card {
            border: 1px dashed #bdc3c7;
            padding: 15px;
            border-radius: 6px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .task-num {
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
        .task-text {
            font-size: 18px;
            line-height: 1.5;
        }
        .fraction {
            display: inline-block;
            vertical-align: middle;
            text-align: center;
            font-size: 16px;
        }
        .fraction span.top {
            display: block;
            border-bottom: 1px solid #000;
            padding: 0 3px;
        }
        .fraction span.bottom {
            display: block;
            padding: 0 3px;
        }

        /* Dölj menyer vid utskrift */
        @media print {
            .controls { display: none; }
            body { margin: 0; }
            .task-card { border: 1px solid #95a5a6; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2>Skapa Startuppgifter</h2>
        <label><b>Antal uppgifter på papperet: </b></label>
        <select id="numTasks">
            <option value="4">4 uppgifter</option>
            <option value="6" selected>6 uppgifter</option>
            <option value="8">8 uppgifter</option>
            <option value="10">10 uppgifter</option>
        </select>

        <h4>Välj områden att slumpa bland:</h4>
        <div class="checkbox-group">
            <label><input type="checkbox" id="cat1" checked> Jämföra decimaltal</label>
            <label><input type="checkbox" id="cat2" checked> Bråkdel av antal</label>
            <label><input type="checkbox" id="cat3" checked> Uppställning (+ / -)</label>
            <label><input type="checkbox" id="cat4" checked> Saknat tal (× / ÷)</label>
            <label><input type="checkbox" id="cat5" checked> Proportionalitet</label>
            <label><input type="checkbox" id="cat6" checked> Storleksordning (Bråk/Dec/%)</label>
        </div>

        <button onclick="generateSheet()">Generera nytt blad</button>
        <button class="print-btn" onclick="window.print()">Skriv ut / Spara PDF</button>
    </div>

    <!-- Utskrivbar del -->
    <div id="printArea">
        <div class="worksheet-title">
            <h2>Startuppgift Matematik</h2>
        </div>
        <div class="header-line">
            <span>Namn: _______________________</span>
            <span>Datum: ___________</span>
        </div>
        <div class="task-grid" id="taskList"></div>
    </div>

    <script>
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Generatorer baserade på dina bilder
        const generators = [
            // 1. Jämför decimaltal (t.ex. Vilket är det största talet? 2,581 eller 2,68)
            function() {
                let base = randInt(1, 9);
                let d1 = (base + randInt(10, 89)/1000).toFixed(3).replace('.', ',');
                let d2 = (base + randInt(1, 9)/10).toFixed(2).replace('.', ',');
                return `Vilket är det största talet?<br><b>${d1}</b> eller <b>${d2}</b>`;
            },
            // 2. Bråk av heltal (t.ex. Visa hur du löser uppgiften: 3/5 av 75)
            function() {
                let den = [3, 4, 5, 10][randInt(0, 3)];
                let num = randInt(2, den - 1);
                let factor = randInt(5, 20);
                let total = den * factor;
                return `Visa hur du löser uppgiften.<br><div class="fraction"><span class="top">${num}</span><span class="bottom">${den}</span></div> av <b>${total}</b>`;
            },
            // 3. Uppställning Addition/Subtraktion
            function() {
                let isAdd = Math.random() > 0.5;
                if(isAdd) {
                    let a = (randInt(1, 9) + randInt(10, 99)/100).toFixed(2).replace('.', ',');
                    let b = (randInt(0, 4) + randInt(10, 99)/100).toFixed(2).replace('.', ',');
                    return `Visa hur du löser uppgiften.<br><b>${a} + ${b} =</b>`;
                } else {
                    let a = randInt(10, 50);
                    let b = (randInt(1, 8) + randInt(10, 99)/100).toFixed(2).replace('.', ',');
                    return `Visa hur du löser uppgiften.<br><b>${a} - ${b} =</b>`;
                }
            },
            // 4. Ekvation / Multiplikation med decimaltal
            function() {
                let factor1 = randInt(2, 6);
                let factor2 = (randInt(1, 9) / 10);
                let prod = (factor1 * factor2).toFixed(1).replace('.', ',');
                return `Vilket tal multiplicerat med <b>${factor1}</b> ger en produkt som är <b>${prod}</b>?`;
            },
            // 5. Proportionalitet (Textuppgift)
            function() {
                let items = ["munkar", "bullar", "äpplen", "pennor"];
                let item = items[randInt(0, items.length - 1)];
                let names = [["Alma", "Sara"], ["Leo", "Hugo"], ["Maja", "Ella"]][randInt(0, 2)];
                
                let unitPrice = randInt(3, 8);
                let count1 = randInt(2, 4);
                let count2 = count1 + randInt(1, 3);
                
                let price1 = count1 * unitPrice;
                return `${names[0]} köper ${count1} ${item} för ${price1} kr.<br>${names[1]} köper ${count2} ${item} av samma sort. Hur mycket får ${names[1]} betala?`;
            },
            // 6. Storleksordning (Bråk, Decimal, Procent)
            function() {
                let options = ["0,30", "2/5", "25 %", "1/3", "0,15", "50 %", "3/4", "0,8", "10 %"];
                // Välj 4 slumpmässiga från listan utan dubbletter
                let shuffled = options.sort(() => 0.5 - Math.random()).slice(0, 4);
                
                let formatted = shuffled.map(item => {
                    if(item.includes('/')) {
                        let parts = item.split('/');
                        return `<div class="fraction"><span class="top">${parts[0]}</span><span class="bottom">${parts[1]}</span></div>`;
                    }
                    return item;
                }).join('&nbsp;&nbsp;&nbsp;&nbsp;');

                return `Välj följande tal i storleksordning med det minsta talet först.<br><br>${formatted}`;
            }
        ];

        function generateSheet() {
            let taskCount = parseInt(document.getElementById('numTasks').value);
            
            // Kolla vilka kategorier som är ibockade
            let activeGenerators = [];
            for(let i = 1; i <= 6; i++) {
                if(document.getElementById('cat' + i).checked) {
                    activeGenerators.push(generators[i-1]);
                }
            }

            if(activeGenerators.length === 0) {
                alert("Vänligen välj minst ett område!");
                return;
            }

            let taskListDiv = document.getElementById('taskList');
            taskListDiv.innerHTML = '';

            // Slumpa uppgifter från de valda kategorierna
            for(let i = 1; i <= taskCount; i++) {
                let randomGen = activeGenerators[randInt(0, activeGenerators.length - 1)];
                let taskHtml = randomGen();

                let card = document.createElement('div');
                card.className = 'task-card';
                card.innerHTML = `
                    <div>
                        <div class="task-num">Uppgift ${i}</div>
                        <div class="task-text">${taskHtml}</div>
                    </div>
                `;
                taskListDiv.appendChild(card);
            }
        }

        // Generera första bladet automatiskt vid start
        window.onload = generateSheet;
    </script>
</body>
</html>
